<!doctype html>
<html>
  <body style="margin:0;background:#f3f6f9;font-family:Arial,sans-serif">
    <div style="max-width:600px;margin:24px auto;padding:28px;background:#fff">
      <div style="display:none;max-height:0;overflow:hidden">$preheader</div>
      $greeting
      <h1 style="color:#123b5d">$title</h1>
      $body
      <hr>
      <p style="color:#718096;font-size:12px">
        You received this email from $brand_name. This mailbox is not monitored;
        please do not reply. Never share your PIN, OTP, or password by email.
      </p>
      <p style="color:#718096;font-size:12px">
        &copy; $year $brand_name, all rights reserved
      </p>
    </div>
  </body>
</html>
